<section id="skills" class="section section-muted">
    <div class="container">
        <h2 class="section-title">Technical skills</h2>
        <div class="skills-grid">
            @for (t of skills(); track t._id ){
            <div class="skill-group">
                <h3>{{t.title}}</h3>
                <ul class="tag-list">
                    @for(s of t.skills; track s){
                    <li>{{s}}</li>
                    }
                </ul>
            </div>

            }


        </div>
    </div>
</section>
